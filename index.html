<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- set the theme before first paint, avoids a flash of the wrong theme -->
  <script>
    try {
      var pgTheme = localStorage.getItem("pg-theme");
      if (pgTheme) document.documentElement.dataset.theme = pgTheme;
    } catch (e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/gh/MarketingPipeline/Markdown-Tag/markdown-tag.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pony Games: your central directory for pony games, jams, and community resources." />
  <title>Pony Games</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>

  <!-- ===================== HEADER / NAV ===================== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-logo">
        <img src="textlogo.png" alt="Pony Games logo">
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="resources.html">Resources</a>
        <a href="about.html">About</a>
        <select id="theme-switcher" class="theme-switcher" aria-label="Site theme">
          <option value="midnight">Moonbeam</option>
          <option value="light">Sunbeam</option>
        </select>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- ===================== JAM TIMER ===================== -->
    <section id="jam-timer" class="jam-timer" aria-label="Jam timer">
      <p class="jam-timer__status"></p>
      <p class="jam-timer__message"></p>
      <div class="jam-timer__countdown" hidden></div>
      <a class="jam-timer__link" hidden></a>
    </section>

    <!-- ===================== HOME LAYOUT: Blog + Sidebar ===================== -->
    <div class="home-layout">

      <!-- --- News blog --- -->
      <section class="news-blog" aria-label="News blog">
        <h2 class="section-title">Latest News</h2>

        <div id="news-blog"></div>

        <nav class="pagination" aria-label="Blog pagination">
          <button id="blog-prev" class="pagination__btn" type="button">← Prev</button>
          <span id="blog-page-info" class="pagination__info">Page 1 of 1</span>
          <button id="blog-next" class="pagination__btn" type="button">Next →</button>
        </nav>
      </section>

      <!-- --- Recommendations sidebar: 3 newest + 3 random --- -->
      <aside class="game-sidebar" aria-label="Game recommendations">
        <div class="game-sidebar__columns">
          <div>
            <h2 class="game-sidebar__column-title"><span class="game-sidebar__icon" aria-hidden="true">✦</span> Newest</h2>
            <div id="sidebar-recent"></div>
          </div>
          <div>
            <div class="game-sidebar__column-header">
              <h2 class="game-sidebar__column-title"><span class="game-sidebar__icon" aria-hidden="true">🎲</span> Random</h2>
              <button type="button" id="sidebar-shuffle" class="sidebar-shuffle" title="Shuffle random picks" aria-label="Shuffle random picks">↻</button>
            </div>
            <div id="sidebar-random"></div>
          </div>
        </div>
      </aside>

    </div>

    <!-- ===================== UPCOMING / IN DEVELOPMENT ===================== -->
    <section class="upcoming-section" aria-label="Upcoming games">
      <h2 class="section-title">Upcoming &amp; In Development</h2>
      <div id="upcoming-grid" class="upcoming-scroll"></div>
    </section>

  </main>

  <!-- ===================== GAME DETAIL PANEL ===================== -->
  <div id="detail-panel" class="detail-panel" role="dialog" aria-modal="true" aria-label="Game details">
    <div class="detail-panel__content">
      <button class="detail-panel__close" type="button" aria-label="Close details">&times;</button>
      <div class="detail-panel__carousel" hidden>
        <div class="carousel__track"></div>
        <button class="carousel__btn carousel__btn--prev" type="button" aria-label="Previous screenshot">‹</button>
        <button class="carousel__btn carousel__btn--next" type="button" aria-label="Next screenshot">›</button>
        <div class="carousel__dots"></div>
      </div>
      <img class="detail-panel__thumb" src="" alt="" />
      <h2 class="detail-panel__title"></h2>
      <p class="detail-panel__author" hidden></p>
      <p class="detail-panel__release" hidden></p>
      <div class="detail-panel__playtime-wrap" hidden>
        <div class="detail-panel__playtime-header">
          <span class="detail-panel__playtime-label">Playtime</span>
          <span class="detail-panel__playtime"></span>
        </div>
        <div class="detail-panel__playtime-bar" role="presentation">
          <div class="detail-panel__playtime-fill"></div>
        </div>
      </div>
      <div class="detail-panel__meta">
        <div class="detail-panel__tags"></div>
      </div>
      <p class="detail-panel__description"></p>
      <div class="detail-panel__downloads"></div>
    </div>
  </div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Pony Games. A community directory for pony games.</p>
    </div>
  </footer>

  <script src="js/timer.js"></script>
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/MarketingPipeline/Markdown-Tag/markdown-tag.js"></script> 
</body>
</html>
