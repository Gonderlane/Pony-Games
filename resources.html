<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- set the theme before first paint, avoids a flash of the wrong theme -->
  <script>
    try {
      var pgTheme = localStorage.getItem("pg-theme");
      if (pgTheme) document.documentElement.dataset.theme = pgTheme;
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Free assets and resources for pony game developers: sprites, tilesets, music, and more." />
  <title>Resources | Pony Games</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-resources">

  <!-- ===================== HEADER / NAV ===================== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-logo">
        <img src="textlogo.png" alt="Pony Games logo">
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="resources.html">Resources</a>
        <a href="about.html">About</a>
        <select id="theme-switcher" class="theme-switcher" aria-label="Site theme">
          <option value="midnight">Moonbeam</option>
          <option value="light">Sunbeam</option>
          <option value="trixie">Boaster Blue</option>
          <option value="twilight">Magical Purple</option>
          <option value="applejack">Rural Orange</option>
          <option value="pinkie">Party Pink</option>
          <option value="rarity">Rare White</option>
          <option value="rainbow">Speedy Blue</option>
          <option value="fluttershy">Butterfly Yellow</option>

        </select>
      </nav>
    </div>
  </header>

  <main class="container">

    <h1 class="page-title">Resources</h1>
    <p style="color: var(--color-text-muted); margin-bottom: 1.25rem;">
      Free assets for game developers. Click a card for full details and download links.
    </p>

    <div class="resources-layout">
      <div>
        <!-- ===================== CARD GRID ===================== -->
        <div id="card-grid" class="card-grid" data-type="resources"></div>
      </div>

      <aside class="games-filter" aria-label="Filter resources">
        <h2 class="games-filter__title">Search & Filters</h2>

        <div class="games-filter__group">
          <label for="resource-sort">Sort by</label>
          <select id="resource-sort">
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
        </div>

        <div class="games-filter__group">
          <label for="resources-search">Search</label>
          <input id="resources-search" type="search" placeholder="Name, tag, asset pack, or author..." autocomplete="off" />
        </div>

        <div class="games-filter__group">
          <label>Type</label>
          <div id="filter-resource-type-chips" class="tag-filter-chips"></div>
        </div>

        <div class="games-filter__group">
          <label>Tags</label>
          <div id="filter-resource-tag-chips" class="tag-filter-chips"></div>
        </div>

        <div class="games-filter__group">
          <label>License</label>
          <div id="filter-resource-license-chips" class="tag-filter-chips"></div>
        </div>

        <div class="games-filter__group">
          <label>Asset Pack</label>
          <div id="filter-resource-asset-pack-chips" class="tag-filter-chips"></div>
        </div>

        <div class="games-filter__group">
          <label>Author</label>
          <div id="filter-resource-author-chips" class="tag-filter-chips"></div>
        </div>

        <button type="button" id="resource-filter-clear" class="filter-clear" hidden>Clear all</button>
        <p id="resource-filter-results" class="games-filter__results">0 resources</p>
      </aside>
    </div>

  </main>

  <!-- ===================== DETAIL PANEL ===================== -->
  <div id="detail-panel" class="detail-panel" role="dialog" aria-modal="true" aria-label="Resource details">
    <div class="detail-panel__content">
      <button class="detail-panel__close" type="button" aria-label="Close details">&times;</button>
      <div class="detail-panel__carousel" hidden>
        <div class="carousel__track"></div>
        <button class="carousel__btn carousel__btn--prev" type="button" aria-label="Previous screenshot">‹</button>
        <button class="carousel__btn carousel__btn--next" type="button" aria-label="Next screenshot">›</button>
        <div class="carousel__dots"></div>
      </div>
      <img class="detail-panel__thumb" src="" alt="" />
      <h2 class="detail-panel__title"></h2>
      <p class="detail-panel__author" hidden></p>
      <div class="detail-panel__meta">
        <div class="detail-panel__tags"></div>
      </div>
      <div class="detail-panel__asset-packs"></div>
      <p class="detail-panel__description"></p>
      <div class="detail-panel__downloads">
        <div class="download-row"><div class="download-row__btns"></div></div>
      </div>
    </div>
  </div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="container">
      <div id='mlpring'>
        <script type="text/javascript" src="https://mlp-ring.neocities.org/ring-js/onionring-variables.js"></script>
        <script type="text/javascript" src="https://mlp-ring.neocities.org/ring-js/onionring-widget.js"></script>
      </div>
      <p>&copy; 2026 Pony Games. A community directory for pony games.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
