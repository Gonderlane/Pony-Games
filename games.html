<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- set the theme before first paint, avoids a flash of the wrong theme -->
  <script>
    try {
      var pgTheme = localStorage.getItem("pg-theme");
      if (pgTheme) document.documentElement.dataset.theme = pgTheme;
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse pony games: fan games, jam entries, and community projects." />
  <meta name="referrer" content="same-origin">
  <title>Games | Pony Games</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== HEADER / NAV ===================== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-logo">
        <img src="textlogo.png" alt="Pony Games logo">
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="resources.html">Resources</a>
        <a href="about.html">About</a>
        <select id="theme-switcher" class="theme-switcher" aria-label="Site theme">
          <option value="midnight">Moonbeam</option>
          <option value="light">Sunbeam</option>
          <option value="trixie">Boaster Blue</option>
          <option value="twilight">Magical Purple</option>
          <option value="applejack">Rural Orange</option>
          <option value="pinkie">Party Pink</option>
          <option value="rarity">Rare White</option>
          <option value="rainbow">Speedy Blue</option>
          <option value="fluttershy">Butterfly Yellow</option>

        </select>
      </nav>
    </div>
  </header>

  <main class="container">

    <h1 class="page-title">Pony Games</h1>
    <p style="color: var(--color-text-muted); margin-bottom: 2rem;">
      A curated collection of pony fan games. Click a card for full details.<br>   
      Click <a href="https://forms.gle/mSdyHB62iVxTfgmx9" style="color: var(--color-accent-soft);">here</a> to request a change or submit a game.
    </p>

    <div class="games-layout">
      <!-- ===================== CARD GRID + PAGINATION ===================== -->
      <div>
        <div id="card-grid" class="card-grid" data-type="games"></div>
        <nav id="games-pagination" class="pagination" aria-label="Games pagination" hidden>
          <button id="games-prev" class="pagination__btn" type="button">← Prev</button>
          <span id="games-page-info" class="pagination__info">Page 1 of 1</span>
          <button id="games-next" class="pagination__btn" type="button">Next →</button>
        </nav>
      </div>

      <!-- ===================== SEARCH & FILTER PANEL ===================== -->
      <aside class="games-filter" aria-label="Search and filter games">
        <form id="games-filter" class="games-filter__form">
          <h2 class="games-filter__title">Search & Filters</h2>

          <div class="games-filter__group">
            <label for="filter-sort">Sort by</label>
            <select id="filter-sort">
              <option value="newest">Newest added</option>
              <option value="oldest">Oldest added</option>
              <option value="az">A → Z</option>
              <option value="za">Z → A</option>
              <option value="release-newest">Release date (newest)</option>
              <option value="release-oldest">Release date (oldest)</option>
              <option value="playtime-asc">Playtime (short → long)</option>
              <option value="playtime-desc">Playtime (long → short)</option>
            </select>
          </div>

          <div class="games-filter__group">
            <label for="filter-perpage">Show</label>
            <select id="filter-perpage">
              <option value="50">50 per page</option>
              <option value="100">100 per page</option>
              <option value="200">200 per page</option>
              <option value="500">500 per page</option>
              <option value="all">All at once</option>
            </select>
          </div>

          <div class="games-filter__group">
            <label for="filter-search">Search</label>
            <input id="filter-search" type="search" placeholder="Title or author..." autocomplete="off" />
          </div>

          <div class="games-filter__group">
            <label class="nsfw-toggle">
              <input type="checkbox" id="filter-nsfw" />
              <span class="nsfw-toggle__label">Show NSFW</span>
              <span class="nsfw-toggle__track"></span>
            </label>
            <label class="nsfw-toggle">
              <input type="checkbox" id="filter-gore" />
              <span class="nsfw-toggle__label">Show Gore</span>
              <span class="nsfw-toggle__track"></span>
            </label>
          </div>

          <div class="games-filter__group">
            <label>Genre</label>
            <div id="filter-genre-chips" class="tag-filter-chips"></div>
          </div>

          <div class="games-filter__group">
            <label>Tags</label>
            <div id="filter-tag-chips" class="tag-filter-chips"></div>
          </div>

          <div class="games-filter__group">
            <label>Published</label>
            <div id="filter-releaseyear-chips" class="tag-filter-chips"></div>
          </div>

          <div class="games-filter__group">
            <label>Playtime</label>
            <div id="filter-playtime-chips" class="tag-filter-chips"></div>
          </div>

          <div class="games-filter__group">
            <label>Status</label>
            <div id="filter-status-chips" class="tag-filter-chips"></div>
          </div>

          <div class="games-filter__group">
            <label>Engine</label>
            <div id="filter-engine-chips" class="tag-filter-chips"></div>
          </div>

          <div class="games-filter__group">
            <label>Platform</label>
            <div id="filter-platform-chips" class="tag-filter-chips"></div>
          </div>

          <div id="filter-chips" class="filter-chips"></div>
          <button type="button" id="filter-clear" class="filter-clear" hidden>Clear all</button>

          <p id="filter-results" class="games-filter__results">0 games</p>
        </form>
      </aside>
    </div>

  </main>

  <!-- ===================== DETAIL PANEL ===================== -->
  <div id="detail-panel" class="detail-panel" role="dialog" aria-modal="true" aria-label="Game details">
    <div class="detail-panel__content">
      <button class="detail-panel__close" type="button" aria-label="Close details">&times;</button>
      <div class="detail-panel__carousel" hidden>
        <div class="carousel__track"></div>
        <button class="carousel__btn carousel__btn--prev" type="button" aria-label="Previous screenshot">‹</button>
        <button class="carousel__btn carousel__btn--next" type="button" aria-label="Next screenshot">›</button>
        <div class="carousel__dots"></div>
      </div>
      <img class="detail-panel__thumb" src="" alt="" />
      <h2 class="detail-panel__title"></h2>
      <p class="detail-panel__author" hidden></p>
      <p class="detail-panel__release" hidden></p>
      <div class="detail-panel__playtime-wrap" hidden>
        <div class="detail-panel__playtime-header">
          <span class="detail-panel__playtime-label">Playtime</span>
          <span class="detail-panel__playtime"></span>
        </div>
        <div class="detail-panel__playtime-bar" role="presentation">
          <div class="detail-panel__playtime-fill"></div>
        </div>
      </div>
      <div class="detail-panel__meta">
        <div class="detail-panel__tags"></div>
      </div>
      <p class="detail-panel__description"></p>
      <div class="detail-panel__downloads"></div>
    </div>
  </div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="container">
      <div id='mlpring'>
        <script type="text/javascript" src="https://mlp-ring.neocities.org/ring-js/onionring-variables.js"></script>
        <script type="text/javascript" src="https://mlp-ring.neocities.org/ring-js/onionring-widget.js"></script>
      </div>
      <p>&copy; 2026 Pony Games. A community directory for pony games.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
